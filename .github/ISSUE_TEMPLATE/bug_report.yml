name: Bug report
description: Report a reproducible GuildControl MCP defect without exposing credentials or Discord data
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not paste bot tokens, webhook credentials, invite codes, policy files, raw Discord payloads, private identifiers, message content, logs, screenshots, or recordings. Use synthetic examples and fixed error categories. Report vulnerabilities through a private Security Advisory.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, Discord content, private identifiers, local paths, and raw live output
          required: true
        - label: This report does not describe an undisclosed security vulnerability
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Exact package version, image tag, or source revision
      placeholder: MAJOR.MINOR.PATCH
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - npm package
        - OCI image
        - Source checkout
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node.js version, operating system, architecture, and MCP client family without account or machine identifiers
      placeholder: Node.js 22, macOS, arm64, stdio MCP client
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe the outcome using fixed error codes and sanitized counts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Use fake IDs and content; do not attach configuration or live output
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Local verification
      description: List the offline commands run and their sanitized pass, warning, or fixed error result
      placeholder: guildcontrol config validate ...; guildcontrol doctor ...
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I reproduced this with the narrowest applicable policy and toolset
          required: true
        - label: I checked the complete reference and existing issues
          required: true
