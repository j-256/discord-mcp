name: Operator question
description: Ask a setup, policy, permission, diagnostic, or verification question safely
title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Read SUPPORT.md and docs/limitations.md before continuing. Do not paste configuration files, tokens, credentials, Discord content, private identifiers, local paths, raw payloads, logs, screenshots, or recordings. Use fixed error categories, sanitized counts, and synthetic examples. Use a private Security Advisory for an undisclosed vulnerability.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and routing check
      options:
        - label: I removed credentials, Discord content, private identifiers, local paths, configuration, and raw live output
          required: true
        - label: This is not an undisclosed vulnerability or an active moderation or account-security incident
          required: true
  - type: dropdown
    id: category
    attributes:
      label: Question category
      options:
        - Bot installation
        - Local configuration or credential reference
        - MCP host launch
        - Discord permissions, intents, or scope
        - Diagnostic or recovery
        - Package, image, or supply-chain verification
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - npm package
        - OCI image
        - Source checkout
        - Not installed yet
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Exact package version, image tag, or source revision when applicable
      placeholder: MAJOR.MINOR.PATCH
  - type: input
    id: runtime
    attributes:
      label: Runtime family
      description: Node.js major version, operating-system family, architecture, and MCP host family without account or machine identifiers
      placeholder: Node.js 22, Linux, amd64, stdio MCP host
  - type: textarea
    id: goal
    attributes:
      label: Intended outcome
      description: Describe what you are trying to accomplish without guild details, names, IDs, content, or private configuration
    validations:
      required: true
  - type: textarea
    id: policy_surface
    attributes:
      label: Public policy surface
      description: List only public preset, recipe, toolset, command, permission, or intent names that matter; do not paste a configuration document
  - type: textarea
    id: attempts
    attributes:
      label: Documentation and offline checks tried
      description: List documentation sections and credential-free commands with only pass, warning, fixed error category, or sanitized-count results
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Exact question
      description: Ask the smallest question that would unblock the intended outcome using synthetic examples where needed
    validations:
      required: true
