name: Feature proposal
description: Propose a capability with explicit authority, privacy, and failure boundaries
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        No Discord content, credentials, private identifiers, raw payloads, or copied production configuration belong in a proposal. Use official route names, synthetic IDs, and privacy-safe examples.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This proposal contains no credential, Discord content, private identifier, local path, or raw live output
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator outcome is missing, and why existing tools or workflows do not solve it
    validations:
      required: true
  - type: textarea
    id: discord_contract
    attributes:
      label: Discord contract
      description: Link the official Discord route, Gateway event, permission, intent, and prerequisite documentation
    validations:
      required: true
  - type: dropdown
    id: operation_class
    attributes:
      label: Operation class
      options:
        - Read-only
        - Additive write
        - Reversible write
        - Destructive write
        - Asynchronous or ambiguous write
        - Local operator workflow
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority boundary
      description: Identify the narrowest toolset, capability gate, exact scope, Discord permissions, privileged intents, and host approval required
    validations:
      required: true
  - type: textarea
    id: privacy_persistence
    attributes:
      label: Privacy and persistence
      description: Identify every Discord value touched and whether it is returned, omitted, transient, hashed, or durably recorded
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Freshness and failure safety
      description: Explain exact targeting, planning, confirmation, concurrency, retry, readback, restart, and uncertain-outcome behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include narrower workflows and reasons they are insufficient
    validations:
      required: true
